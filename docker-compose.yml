services:
  backend:
    image: nurtlina-backend:local
    build:
      context: ./backend
    ports:
      - "20003:8080"
    environment:
      APP_VERSION: ${APP_VERSION:-1.0.0}
      DEBUG: ${DEBUG:-true}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://nurtlina:password@host.docker.internal:5432/nurtlina}
      DATABASE_SYNC_URL: ${DATABASE_SYNC_URL:-postgresql+psycopg2://nurtlina:password@host.docker.internal:5432/nurtlina}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-nurtlina-local}
      FIREBASE_SERVICE_ACCOUNT_PATH: ${FIREBASE_SERVICE_ACCOUNT_PATH:-/secrets/firebase-service-account.json}
      GOOGLE_PLAY_PACKAGE_NAME: ${GOOGLE_PLAY_PACKAGE_NAME:-com.nurtlina.app}
      GOOGLE_PLAY_SERVICE_ACCOUNT_PATH: ${GOOGLE_PLAY_SERVICE_ACCOUNT_PATH:-}
      GCS_BUCKET_NAME: ${GCS_BUCKET_NAME:-}
      GCS_EXPORT_EXPIRY_SECONDS: ${GCS_EXPORT_EXPIRY_SECONDS:-3600}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health').read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  redis:
    image: redis:7-alpine
    ports:
      - "23739:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
