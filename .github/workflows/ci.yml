name: Deploy

# Temporarily disabled. Keep the workflow available for manual runs only.
on:
  workflow_dispatch:

jobs:
  backend:
    name: Backend checks and deploy
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test
      DATABASE_SYNC_URL: postgresql+psycopg2://test:test@localhost:5432/test
      FIREBASE_PROJECT_ID: test-project
      FIREBASE_SERVICE_ACCOUNT_PATH: /dev/null

    steps:
      - name: 0. 获取最新代码
        uses: actions/checkout@v4

      - name: 1. 设置 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 2. 安装 uv
        uses: astral-sh/setup-uv@v4

      - name: 3. 生成后端锁文件
        working-directory: backend
        run: uv lock

      - name: 4. 安装后端依赖
        working-directory: backend
        run: uv sync

      - name: 5. 后端代码检查
        working-directory: backend
        run: |
          uv run ruff check app
          uv run ruff format --check app

      - name: 6. 后端单元测试
        working-directory: backend
        run: uv run pytest --cov=app --cov-report=xml -v

      - name: 7. 通过 SCP 将后端代码推送到服务器
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "docker-compose.yml,backend/Dockerfile,backend/pyproject.toml,backend/uv.lock,backend/alembic.ini,backend/alembic,backend/app"
          target: ${{ secrets.DEPLOY_PATH }}
          overwrite: true

      - name: 8. SSH 登录服务器并重启 Docker 容器
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd "${{ secrets.DEPLOY_PATH }}"

            echo ">>> 正在检查 Docker 权限..."
            DOCKER="docker"
            if ! docker ps > /dev/null 2>&1; then
              DOCKER="sudo docker"
            fi

            if [ ! -f .env ]; then
              echo ">>> 警告：未找到 .env，将使用 docker-compose.yml 中的默认环境变量。"
            fi

            echo ">>> 正在构建后端镜像..."
            $DOCKER compose build backend

            echo ">>> 正在启动 Redis..."
            $DOCKER compose up -d redis

            echo ">>> 正在执行数据库迁移..."
            $DOCKER compose run --rm backend uv run alembic upgrade head

            echo ">>> 正在重启后端服务..."
            $DOCKER compose up -d backend

            echo ">>> 正在清理旧镜像..."
            $DOCKER image prune -f

            echo ">>> 部署完成，后端服务已上线！"
